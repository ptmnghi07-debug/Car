<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Car Gallery - Coursera Final Project</title>
  <style>
    /* Nền trang trí màu xám đậm hiện đại phong cách xe thể thao */
    body {
      margin: 2%;
      border: 3px solid #37474f;
      background-color: #eceff1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      border-radius: 12px;
      padding: 10px;
    }

    h1 {
      color: #263238;
      margin-bottom: 10px;
    }

    /* Khung hiển thị ảnh xe lớn ở giữa */
    #image {
      line-height: 500px;
      width: 500px;
      height: 500px;
      border: 5px solid #212121;
      border-radius: 15px;
      margin: 10px auto 25px auto;
      text-align: center;
      background-color: #424242;
      background-repeat: no-repeat;
      color: #ffffff;
      font-size: 140%;
      font-weight: bold;
      background-size: cover;
      background-position: center;
      box-shadow: 0px 6px 12px rgba(0,0,0,0.3);
    }

    /* Định dạng 6 ảnh xe nhỏ bên dưới */
    img.preview {
      width: 14%;
      height: 120px;
      object-fit: cover;
      margin: 0.8%;
      border: 3px solid #212121;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    /* Hiệu ứng khi di chuột hoặc nhấn phím Tab (Focus) vào ảnh */
    img.preview:hover, img.preview:focus {
      transform: scale(1.08);
      border-color: #d32f2f;
      outline: 3px solid #ffeb3b; /* Viền nổi bật hỗ trợ tiếp cận bàn phím */
    }
  </style>
</head>

<!-- Thêm sự kiện onload để chạy hàm addTabIndexes khi trang vừa tải xong -->
<body onload="addTabIndexes()">

  <h1>Thư Viện Các Loại Xe Thể Thao 🏎️</h1>

  <!-- Khung ảnh lớn hiển thị mặc định -->
  <div id="image">
    Hover over an image below to display here.
  </div>

  <!-- Danh sách 6 hình ảnh về xe (bao gồm đầy đủ alt, sự kiện chuột và bàn phím) -->
  <img class="preview" 
       alt="Siêu xe thể thao màu đỏ cá tính" 
       src="https://images.pexels.com/photos/337909/pexels-photo-337909.jpeg?auto=compress&cs=tinysrgb&w=600" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)"
       onblur="unDo()">

  <img class="preview" 
       alt="Xe cổ điển sang trọng và cổ kính" 
       src="https://images.pexels.com/photos/210019/pexels-photo-210019.jpeg?auto=compress&cs=tinysrgb&w=600" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)"
       onblur="unDo()">

  <img class="preview" 
       alt="Siêu xe hiện đại chạy trên đường phố" 
       src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg?auto=compress&cs=tinysrgb&w=600" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)"
       onblur="unDo()">

  <img class="preview" 
       alt="Xe thể thao màu vàng nổi bật" 
       src="https://images.pexels.com/photos/112460/pexels-photo-112460.jpeg?auto=compress&cs=tinysrgb&w=600" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)"
       onblur="unDo()">

  <img class="preview" 
       alt="Xe đua kiểu dáng mạnh mẽ" 
       src="https://images.pexels.com/photos/116675/pexels-photo-116675.jpeg?auto=compress&cs=tinysrgb&w=600" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)"
       onblur="unDo()">

  <img class="preview" 
       alt="Xe thể thao màu cam cá tính" 
       src="https://th.bing.com/th/id/OIP.9z2Zkj3-WCbTdYD1xvyytQHaE8?w=288&h=192&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" 
       onmouseover="upDate(this)" 
       onmouseleave="unDo()"
       onfocus="upDate(this)"
       onblur="unDo()">

  <script>
    /* Hàm chạy khi di chuột vào hoặc nhấn Tab chuyển tiêu điểm (Focus) */
    function upDate(previewPic) {
      console.log("Sự kiện kích hoạt cho xe:", previewPic.alt);
      let imageDiv = document.getElementById("image");
      
      // Đổi câu chữ hiển thị thành thuộc tính alt của ảnh
      imageDiv.innerHTML = previewPic.alt;
      
      // Đổi ảnh nền thành đường dẫn src của ảnh
      imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
    }

    /* Hàm chạy khi rê chuột ra ngoài hoặc rời tiêu điểm phím Tab (Blur) */
    function unDo() {
      let imageDiv = document.getElementById("image");
      
      // Xóa ảnh nền
      imageDiv.style.backgroundImage = "url('')";
      
      // Trả lại nội dung chữ mặc định
      imageDiv.innerHTML = "Hover over an image below to display here.";
    }

    /* Hàm tự động thêm tabindex="0" cho tất cả các hình ảnh bằng vòng lặp FOR khi tải trang */
    function addTabIndexes() {
      console.log("Trang web đã tải xong (onload triggered)");
      let images = document.querySelectorAll("img.preview");
      
      for (let i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
        console.log("Đã thêm tabindex='0' cho ảnh xe thứ " + (i + 1));
      }
    }
  </script>
</body>
</html>
